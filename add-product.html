<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Shopy | Add Product</title>
    <link rel="stylesheet" href="styles.css" />
    <script src="js/api.js" defer></script>
    <script src="js/add-product.js" defer></script>
  </head>
  <body>
    <header class="site-header">
      <nav class="navbar" aria-label="Primary navigation">
        <a class="brand" href="index.html">Shopy</a>
        <div class="nav-links">
          <a href="index.html">Home</a>
          <a class="active" href="add-product.html" aria-current="page">Add Product</a>
        </div>
      </nav>
    </header>

    <main>
      <section class="page-heading" aria-labelledby="add-product-title">
        <div>
          <p class="eyebrow">Create</p>
          <h1 id="add-product-title">Add Product</h1>
          <p class="intro">Submit product details to the backend POST API.</p>
        </div>
        <img class="heading-visual" src="assets/images/product-default.svg" alt="Product box illustration" />
      </section>

      <section class="form-shell" aria-labelledby="form-title">
        <h2 id="form-title">Product Information</h2>
        <p class="helper-note">Backend required: run the Flask API at http://localhost:5050 before submitting.</p>
        <form id="productForm" novalidate>
          <div class="field-group">
            <label for="name">Product name</label>
            <input id="name" name="name" type="text" placeholder="Example: Cotton T-shirt" required />
            <small class="field-error" data-error-for="name"></small>
          </div>

          <div class="form-grid">
            <div class="field-group">
              <label for="price">Price</label>
              <input id="price" name="price" type="number" min="1" step="0.01" placeholder="499" required />
              <small class="field-error" data-error-for="price"></small>
            </div>

            <div class="field-group">
              <label for="quantity">Quantity</label>
              <input id="quantity" name="quantity" type="number" min="0" step="1" placeholder="10" required />
              <small class="field-error" data-error-for="quantity"></small>
            </div>
          </div>

          <div class="field-group">
            <label for="category">Category</label>
            <input id="category" name="category" type="text" placeholder="Example: Clothing" required />
            <small class="field-error" data-error-for="category"></small>
          </div>

          <div class="field-group">
            <label for="description">Description</label>
            <textarea id="description" name="description" rows="4" placeholder="Add a short product description" required></textarea>
            <small class="field-error" data-error-for="description"></small>
          </div>

          <div class="form-actions">
            <button class="primary-action" type="submit">Save Product</button>
            <a class="secondary-action" href="index.html">View Products</a>
          </div>

          <p id="formMessage" class="status-message" aria-live="polite"></p>
        </form>
      </section>
    </main>
  </body>
</html>
